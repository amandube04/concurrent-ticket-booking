version: "3.8"

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: my-postgres-container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_enterprise_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pg_enterprise_data:

networks:
  app-network:
    driver: bridge
